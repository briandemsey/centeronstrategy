<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Center on Strategy</title>
  <meta name="description" content="Center on Strategy, CoS LLC, Spearfish, South Dakota.">
  <style>
    :root { --navy: #00132c; --red: #d90300; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh; padding: 2.5rem 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .hero { position: relative; width: min(86vw, 960px); }
    .scene { width: 100%; height: auto; display: block; }
    .hero::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(90deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.32) 34%, rgba(255,255,255,0) 64%);
    }
    .logo {
      position: absolute; z-index: 2;
      left: 4.5%; top: 50%; transform: translateY(-50%);
      width: 36%; height: auto; display: block;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.85));
    }
    .enter {
      margin-top: 2.5rem;
      display: inline-block;
      color: var(--navy);
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      padding: 0.35rem 0 0.35rem 0.3em;
      border-bottom: 1px solid var(--navy);
      transition: letter-spacing 0.25s ease, border-color 0.2s ease;
    }
    .enter:hover, .enter:focus-visible {
      letter-spacing: 0.38em;
      border-bottom-color: var(--red);
      outline: none;
    }
    @media (max-width: 700px) {
      .hero { width: 94vw; }
      .logo { width: 50%; left: 3.5%; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <img class="scene" src="black-hills.jpg" width="1672" height="941" alt="Pine forest and limestone cliffs of the Black Hills at dawn">
    <img class="logo" src="logo-overlay.png" width="1545" height="587" alt="CoS LLC, Center on Strategy">
  </div>
  <a class="enter" href="contents.html">Enter</a>
</body>
</html>
