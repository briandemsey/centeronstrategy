<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Center on Strategy</title>
  <meta name="description" content="Center on Strategy, CoS LLC, Spearfish, South Dakota.">
  <style>
    :root { --navy: #00132c; --red: #d90300; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #ffffff; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh; padding: 2.5rem 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .logo {
      width: min(52vw, 640px);
      height: auto;
      display: block;
    }
    .scene { width: min(86vw, 960px); height: auto; display: block; margin-top: 2.25rem; }
    .enter {
      margin-top: 2.5rem;
      display: inline-block;
      color: var(--navy);
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      padding: 0.35rem 0 0.35rem 0.3em;
      border-bottom: 1px solid var(--navy);
      transition: letter-spacing 0.25s ease, border-color 0.2s ease;
    }
    .enter:hover, .enter:focus-visible {
      letter-spacing: 0.38em;
      border-bottom-color: var(--red);
      outline: none;
    }
    @media (max-width: 700px) {
      .logo { width: 88vw; }
    }
  </style>
</head>
<body>
  <img class="logo" src="logo.png" width="1774" height="887" alt="CoS LLC, Center on Strategy">
  <img class="scene" src="black-hills.jpg" width="1672" height="941" alt="Pine forest and limestone cliffs of the Black Hills at dawn">
  <a class="enter" href="contents.html">Enter</a>
</body>
</html>
